x-airflow-common:
  &airflow-common
  build:
    context: .
    args:
      RUNTIME_UID: ${AIRFLOW_UID:-50000}
  image: mobility-airflow-spark:2.10.5
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?AIRFLOW_WEBSERVER_SECRET_KEY is required}
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Argentina/Buenos_Aires
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Argentina/Buenos_Aires
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-2}
    _PIP_ADDITIONAL_REQUIREMENTS: ""
    ENV: prod
    PROJECT_DIR: /opt/project
    OLTP_DB_HOST: ${DB_HOST:-host.docker.internal}
    OLTP_DB_PORT: ${DB_PORT:-5432}
    OLTP_DB_NAME: ${DB_NAME:-mobility_oltp}
    OLTP_DB_USER: ${DB_USER:-postgres}
    OLTP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    GDPR_HASH_KEY: ${GDPR_HASH_KEY:?GDPR_HASH_KEY is required}
    ANALYTICS_DB_HOST: ${ANALYTICS_DB_HOST:-postgres-analytics}
    ANALYTICS_DB_PORT: ${ANALYTICS_DB_PORT:-5432}
    ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:-mobility_dw}
    ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics}
    ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
    AIRFLOW_DAG_MAX_ACTIVE_RUNS: ${AIRFLOW_DAG_MAX_ACTIVE_RUNS:-1}
    AIRFLOW_SPARK_POOL: ${AIRFLOW_SPARK_POOL:-spark_pool}
    AIRFLOW_SPARK_POOL_SLOTS: ${AIRFLOW_SPARK_POOL_SLOTS:-1}
    SPARK_MASTER: ${SPARK_MASTER:-spark://spark-master:7077}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-768m}
    SPARK_EXECUTOR_CORES: ${SPARK_EXECUTOR_CORES:-1}
    SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST:-airflow-worker}
    SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS:-0.0.0.0}
    SPARK_DRIVER_UI_PORT: ${SPARK_DRIVER_UI_PORT:-4040}
    SPARK_IVY_DIR: /home/airflow/.ivy2
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ../../:/opt/project
  extra_hosts:
    - "host.docker.internal:${DOCKER_HOST_GATEWAY:-172.18.0.1}"
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    postgres-analytics:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  postgres-analytics:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER:-analytics}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
      POSTGRES_DB: ${ANALYTICS_DB_NAME:-mobility_dw}
    ports:
      - "${ANALYTICS_DB_HOST_PORT:-5433}:5432"
    volumes:
      - analytics-db-volume:/var/lib/postgresql/data
      - ./postgres/analytics-init.sql:/docker-entrypoint-initdb.d/10-analytics-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER:-analytics} -d ${ANALYTICS_DB_NAME:-mobility_dw}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        airflow db migrate
        airflow users list | grep -q 'admin' || airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password "$${AIRFLOW_ADMIN_PASSWORD}"
        airflow pools set "$${AIRFLOW_SPARK_POOL}" \
          "$${AIRFLOW_SPARK_POOL_SLOTS}" \
          "Spark execution pool"
    depends_on:
      <<: *airflow-common-depends-on

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME} || celery --app airflow.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    ports:
      - "${SPARK_DRIVER_UI_PORT:-4040}:4040"
    cpus: ${AIRFLOW_WORKER_CPU_LIMIT:-2.0}
    mem_limit: ${AIRFLOW_WORKER_MEMORY_LIMIT:-3g}
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  oltp-db-proxy:
    image: mobility-airflow-spark:2.10.5
    network_mode: host
    entrypoint: ["python3", "/opt/project/infra/airflow/postgres_bridge_proxy.py"]
    environment:
      OLTP_PROXY_LISTEN_HOST: ${OLTP_PROXY_LISTEN_HOST:-172.18.0.1}
      OLTP_PROXY_LISTEN_PORT: ${OLTP_PROXY_LISTEN_PORT:-5432}
      OLTP_PROXY_TARGET_HOST: ${OLTP_PROXY_TARGET_HOST:-127.0.0.1}
      OLTP_PROXY_TARGET_PORT: ${OLTP_PROXY_TARGET_PORT:-5432}
    volumes:
      - ../../:/opt/project:ro
    restart: always

  spark-master:
    profiles: ["spark-cluster"]
    build:
      context: .
      args:
        RUNTIME_UID: ${AIRFLOW_UID:-50000}
    image: mobility-airflow-spark:2.10.5
    entrypoint: ["/usr/bin/dumb-init", "--", "/bin/bash", "-c"]
    command:
      - |
        exec "$${SPARK_HOME}/bin/spark-class" \
          org.apache.spark.deploy.master.Master \
          --host spark-master \
          --port 7077 \
          --webui-port 8080
    environment:
      SPARK_HOME: /home/airflow/.local/lib/python3.12/site-packages/pyspark
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_DAEMON_MEMORY: ${SPARK_MASTER_DAEMON_MEMORY:-384m}
    ports:
      - "${SPARK_MASTER_UI_PORT:-8081}:8080"
    expose:
      - 7077
    cpus: ${SPARK_MASTER_CPU_LIMIT:-0.5}
    mem_limit: ${SPARK_MASTER_MEMORY_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: always

  spark-worker-1:
    <<: &spark-worker
      profiles: ["spark-cluster"]
      build:
        context: .
        args:
          RUNTIME_UID: ${AIRFLOW_UID:-50000}
      image: mobility-airflow-spark:2.10.5
      entrypoint: ["/usr/bin/dumb-init", "--", "/bin/bash", "-c"]
      command:
        - |
          exec "$${SPARK_HOME}/bin/spark-class" \
            org.apache.spark.deploy.worker.Worker \
            --webui-port "$${SPARK_WORKER_UI_PORT}" \
            --work-dir "$${SPARK_WORKER_DIR}" \
            --cores "$${SPARK_WORKER_CORES}" \
            --memory "$${SPARK_WORKER_MEMORY}" \
            spark://spark-master:7077
      environment: &spark-worker-env
        SPARK_HOME: /home/airflow/.local/lib/python3.12/site-packages/pyspark
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        SPARK_USER: airflow
        SPARK_PUBLIC_DNS: ${SPARK_PUBLIC_DNS:-localhost}
        SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
        SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-768m}
        SPARK_DAEMON_MEMORY: ${SPARK_WORKER_DAEMON_MEMORY:-384m}
        SPARK_WORKER_DIR: /tmp/spark-work
        SPARK_WORKER_UI_PORT: ${SPARK_WORKER_1_UI_PORT:-8082}
      volumes:
        - ../../:/opt/project
      extra_hosts:
        - "host.docker.internal:${DOCKER_HOST_GATEWAY:-172.18.0.1}"
      user: "${AIRFLOW_UID:-50000}:0"
      depends_on:
        spark-master:
          condition: service_healthy
      cpus: ${SPARK_WORKER_CPU_LIMIT:-1.0}
      mem_limit: ${SPARK_WORKER_MEMORY_LIMIT:-1280m}
      restart: always
    ports:
      - "${SPARK_WORKER_1_UI_PORT:-8082}:${SPARK_WORKER_1_UI_PORT:-8082}"

  spark-worker-2:
    <<: *spark-worker
    environment:
      <<: *spark-worker-env
      SPARK_WORKER_UI_PORT: ${SPARK_WORKER_2_UI_PORT:-8083}
    ports:
      - "${SPARK_WORKER_2_UI_PORT:-8083}:${SPARK_WORKER_2_UI_PORT:-8083}"

volumes:
  postgres-db-volume:
  analytics-db-volume:
